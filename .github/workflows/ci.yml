name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: wrangler deploy --dry-run
        run: npx wrangler deploy --dry-run

      - name: README / registry consistency check
        run: |
          echo "::notice::Skipped — no gen-tools-doc script yet (see docs/sessions/SESSION-B.md, deferred to a future session). This step is a placeholder so its absence is visible here rather than silently missing from CI."
