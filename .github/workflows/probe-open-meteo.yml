name: probe-open-meteo (TEMPORARY)
on:
  push:
    branches: [chore/probe-open-meteo]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture real fixtures with the exact production query strings
        run: |
          set -u
          UA="opendata-mcp-probe/1.0"
          # These two URLs are byte-for-byte what buildOpenMeteoUrl produces
          # for each entry's sampleParams (current/daily variable lists,
          # timezone=auto, forecast_days, count/language/format).
          FQ="latitude=35.6785&longitude=139.6823&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=3"
          GQ="name=Tokyo&count=3&language=en&format=json"

          echo "===== FORECAST FIXTURE ====="
          curl -sS -m 30 -A "$UA" -o f.json -w "HTTP=%{http_code} bytes=%{size_download}\n" \
            "https://api.open-meteo.com/v1/forecast?$FQ"
          python3 -m json.tool f.json

          echo
          echo "===== GEOCODING FIXTURE ====="
          curl -sS -m 30 -A "$UA" -o g.json -w "HTTP=%{http_code} bytes=%{size_download}\n" \
            "https://geocoding-api.open-meteo.com/v1/search?$GQ"
          python3 -m json.tool g.json

          echo
          echo "===== licence page (/en/licence, British spelling) ====="
          curl -sSL -m 30 -A "$UA" -o lic.html -w "HTTP=%{http_code} bytes=%{size_download} final=%{url_effective}\n" \
            "https://open-meteo.com/en/licence"
          python3 - <<'PY'
          import re, html
          raw = open("lic.html", encoding="utf-8", errors="replace").read()
          raw = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", raw)
          txt = re.sub(r"(?s)<[^>]+>", " ", raw)
          print(re.sub(r"[ \t\r\n]+", " ", html.unescape(txt)).strip()[:2500])
          PY
          echo "SWEEP DONE"
