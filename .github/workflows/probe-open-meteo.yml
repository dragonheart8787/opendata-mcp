name: probe-open-meteo (TEMPORARY)
on:
  push:
    branches: [chore/probe-open-meteo]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-weather-open-meteo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Run the REAL adapter+registry+tool against the LIVE Open-Meteo API
        run: |
          set -u
          cat > /tmp/live.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { handleGlobalWeatherTool } from "./src/tools/global-weather.js";
          import { runQueryDataset } from "./src/tools/generic.js";

          // No fetchImpl passed -> the global fetch, i.e. a REAL request to
          // the real Open-Meteo API through the real adapter/registry code.
          describe("live Open-Meteo", () => {
            it("global_weather returns a populated envelope for Tokyo", async () => {
              const result = await handleGlobalWeatherTool({ latitude: 35.6785, longitude: 139.6823, forecastDays: 3 }, {});
              const env = result.structuredContent as any;
              console.log("ENVELOPE KEYS:", Object.keys(env).join(", "));
              console.log("provenance:", env.provenance);
              console.log("licence:", JSON.stringify(env.licence));
              console.log("resolved:", JSON.stringify(env.data.resolved));
              console.log("requested:", JSON.stringify(env.data.requested));
              console.log("timezone:", env.data.timezone, env.data.utcOffsetSeconds);
              console.log("current:", JSON.stringify(env.data.current));
              console.log("daily[0]:", JSON.stringify(env.data.daily[0]));
              console.log("daily count:", env.data.daily.length);
              console.log("attribution present:", env.data.attribution.length > 0);
              console.log("--- TEXT ---");
              console.log(result.content[0].text);
              expect(result.isError).toBeUndefined();
              expect(env.ok).toBe(true);
              expect(env.provenance).toBe("third-party-aggregator");
              expect(env.licence.id).toBe("cc-by-4.0");
              expect(env.data.daily.length).toBe(3);
              expect(env.data.current.temperatureC).toBeTypeOf("number");
              expect(env.data.timezone).toBe("Asia/Tokyo");
            }, 30000);

            it("southern-hemisphere + antimeridian coordinate also works", async () => {
              const result = await handleGlobalWeatherTool({ latitude: -41.2865, longitude: 174.7762, forecastDays: 1 }, {});
              const env = result.structuredContent as any;
              console.log("NZ timezone:", env.data.timezone, "current:", JSON.stringify(env.data.current));
              expect(env.ok).toBe(true);
              expect(env.data.daily.length).toBe(1);
            }, 30000);

            it("geocoding via tw_query_dataset resolves a name to coordinates", async () => {
              const { data } = await runQueryDataset("openmeteo:geocoding", { name: "Reykjavik", count: 2 }, {});
              console.log("GEOCODING:", JSON.stringify(data));
              expect((data as any).places.length).toBeGreaterThan(0);
              expect((data as any).places[0].latitude).toBeTypeOf("number");
            }, 30000);

            it("a no-match geocoding query returns an empty list, not a crash", async () => {
              const { data } = await runQueryDataset("openmeteo:geocoding", { name: "zzzzqqqqxxxxvvvv" }, {});
              console.log("NO MATCH:", JSON.stringify(data));
              expect((data as any).places).toEqual([]);
            }, 30000);

            it("a genuinely bad request surfaces upstream's own reason as INVALID_PARAMS", async () => {
              // Bypasses the Zod schema on purpose to exercise the adapter's
              // real 400 handling against the real API.
              const { openMeteoAdapter } = await import("./src/adapters/open-meteo.js");
              const { openMeteoForecastEntry } = await import("./src/registry/open-meteo.js");
              const broken = { ...openMeteoForecastEntry, buildQueryParams: () => ({ latitude: "999", longitude: "121", current: "temperature_2m" }) };
              await expect(openMeteoAdapter.fetchDataset(broken as any, {} as any, {})).rejects.toMatchObject({ code: "INVALID_PARAMS" });
            }, 30000);
          });
          TS
          cp /tmp/live.test.ts ./live.test.ts
          npx vitest run live.test.ts --reporter=verbose 2>&1 | tail -90
