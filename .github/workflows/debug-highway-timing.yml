name: Debug highway timing (temporary)

# TEMPORARY, paired with scripts/debug-highway-timing.mjs and the
# x-debug-timing request-header support in src/index.ts (PR #89). Sends
# several real tools/call requests to the deployed production /mcp endpoint
# for tw_highway_traffic and records the MCP-protocol-layer timing
# breakdown in the job summary. Runs on GitHub Actions (not the Claude Code
# sandbox, which is blocked from reaching *.workers.dev by its egress
# proxy — same reason scripts/smoke-test.mjs runs here instead of locally).
# Delete this workflow (and the paired script/instrumentation) once the
# investigation concludes.

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "Number of real tools/call requests to send"
        required: false
        type: string
        default: "5"

jobs:
  debug-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send real tools/call requests and record timing
        env:
          DEBUG_TIMING_CALLS: ${{ inputs.calls }}
        run: node scripts/debug-highway-timing.mjs
