# TEMPORARY — MUST BE DELETED BEFORE THIS PR IS MERGED.
#
# See the PR description for why this exists: pcc.g0v.ronny.tw is
# unreachable from the dev sandbox (egress proxy denies the domain), so the
# adapter/registry skeleton was built from the service's OpenAPI spec and
# PHP source and needs verifying against the real upstream (AGENTS.md §6).
#
# Findings so far, from runs 1-3 of this workflow:
#   - pcc.g0v.ronny.tw responds in ~0.6s from Actions (NOT silently dropped
#     the way tisvcloud.freeway.gov.tw is), but 301s to
#     https://pcc-api.openfun.app — and the Location header is the bare
#     origin, so the redirect DISCARDS the /api/... path and query string.
#   - Following that redirect lands on `/`, which answers HTTP 403 with a
#     Cloudflare "Just a moment..." managed-challenge page.
#
# Open question this run answers: does the NEW host serve the API when
# asked for the correct path directly? Output is deliberately terse (a
# one-line verdict per request, no HTML dumps) so the answer is readable
# without paging through challenge markup.
name: probe-pcc (TEMPORARY)

on:
  push:
    branches: [feat/pcc-tender-search]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verdict per candidate URL
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          Q="query=%E9%96%8B%E6%94%BE%E6%94%BF%E5%BA%9C"

          probe () { # $1=label $2=url $3=extra curl args
            code=$(curl -sS -m 30 -o body.bin -w "%{http_code}" $3 "$2" 2>/dev/null || echo "ERR")
            size=$(wc -c < body.bin 2>/dev/null || echo 0)
            if head -c 1 body.bin 2>/dev/null | grep -q '[{[]'; then
              verdict="JSON ✅"
            elif grep -qi "just a moment\|cf_chl_opt" body.bin 2>/dev/null; then
              verdict="CLOUDFLARE_CHALLENGE ❌"
            else
              verdict="OTHER/NON-JSON"
            fi
            echo "[$1] HTTP=$code size=$size -> $verdict"
            if [ "$verdict" = "JSON ✅" ]; then
              echo "    top-level keys: $(jq -rc 'keys' body.bin 2>&1 | head -c 300)"
              echo "    records[0]: $(jq -c '.records[0] // empty' body.bin 2>&1 | head -c 600)"
            fi
            sleep 4
          }

          echo "===== NEW HOST, direct path ====="
          probe "new /api/getinfo"                "https://pcc-api.openfun.app/api/getinfo" ""
          probe "new /api/getinfo (browser UA)"   "https://pcc-api.openfun.app/api/getinfo" "-A '$UA'"
          probe "new /api/searchbytitle"          "https://pcc-api.openfun.app/api/searchbytitle?$Q" ""
          probe "new /api/searchbytitle (br UA)"  "https://pcc-api.openfun.app/api/searchbytitle?$Q" "-A '$UA'"

          echo
          echo "===== OLD HOST, no redirect follow (does it serve directly?) ====="
          probe "old /api/getinfo (no -L)"        "https://pcc.g0v.ronny.tw/api/getinfo" ""
          probe "old /api/searchbytitle (no -L)"  "https://pcc.g0v.ronny.tw/api/searchbytitle?$Q" ""

          echo
          echo "===== Is the viewer's own origin usable? ====="
          probe "openfunltd.github.io viewer"     "https://openfunltd.github.io/pcc-viewer/" ""
          echo "DONE — see verdicts above"
