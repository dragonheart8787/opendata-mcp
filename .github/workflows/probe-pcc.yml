# TEMPORARY — MUST BE DELETED BEFORE THIS PR IS MERGED.
#
# Why this exists: `pcc.g0v.ronny.tw` is unreachable from the dev sandbox
# (the egress proxy denies the domain at CONNECT), so `adapters/pcc.ts` and
# `registry/pcc.ts` were built against the service's own OpenAPI spec and
# PHP source rather than a captured real response. AGENTS.md §6 requires
# that kind of skeleton be verified against the real upstream before it can
# be trusted, using a throwaway probe that is removed in the same PR.
#
# This is the GitHub Actions variant of that pattern rather than the
# `/debug/probe-*` Worker route used for `tisvcloud.freeway.gov.tw`, because
# tisvcloud was blocked from Actions too (Azure IPs silently dropped), while
# this host is a normal CORS-open community service with no evidence of
# IP-based blocking. Probing from Actions avoids shipping a debug route to
# production entirely — if it turns out Actions can't reach it either, fall
# back to the Worker debug-route approach.
#
# Deliberately a light client: 3 requests total, spaced, matching the
# "be a good citizen toward volunteer-run infrastructure" reasoning in
# src/constants.ts's TENDER_SEARCH_CACHE_TTL_SECONDS.
name: probe-pcc (TEMPORARY)

on:
  push:
    branches: [feat/pcc-tender-search]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability + searchbytitle response shape
        run: |
          set -uo pipefail
          BASE="https://pcc.g0v.ronny.tw/api"

          echo "===== 0. Redirect chain (first probe got HTTP 301) ====="
          # The service 301s. Find out where to, because the adapter should
          # target the real final URL rather than relying on redirect-following.
          curl -sS -m 30 -D - -o /dev/null "$BASE/getinfo" 2>&1 | head -20
          echo "--- following redirects ---"
          curl -sSL -m 30 -o /dev/null \
            -w "FINAL_URL=%{url_effective}\nHTTP=%{http_code} REDIRECTS=%{num_redirects} TIME=%{time_total}s\n" \
            "$BASE/getinfo" || echo "FAILED: $?"

          sleep 3

          echo
          echo "===== 1. GET /api/getinfo (following redirects) ====="
          curl -sSL -m 30 -w "\nHTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n" \
            "$BASE/getinfo" || echo "FAILED: $?"

          sleep 3

          echo
          echo "===== 2. GET /api/searchbytitle?query=開放政府 ====="
          curl -sSL -m 30 -o search.json \
            -w "FINAL_URL=%{url_effective}\nHTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n" \
            --get --data-urlencode "query=開放政府" "$BASE/searchbytitle" || echo "FAILED: $?"

          echo "--- top-level keys ---"
          jq -r 'keys[]' search.json 2>&1 | head -20
          echo "--- pagination fields ---"
          jq -c '{query, page, total_records, total_pages, records_len: (.records|length)}' search.json 2>&1
          echo "--- FIRST RECORD (verbatim, this is the real shape) ---"
          jq '.records[0]' search.json 2>&1 | head -60
          echo "--- union of record keys across the page ---"
          jq -r '[.records[]? | keys[]] | unique[]' search.json 2>&1 | head -30
          echo "--- union of brief.* keys ---"
          jq -r '[.records[]?.brief | keys[]] | unique[]' search.json 2>&1 | head -30

          sleep 3

          echo
          echo "===== 3. GET /api/tender for the first hit ====="
          echo "(this returns the FULL announcement record — its keys are exactly"
          echo " the valid columns[] names, which is how we learn whether"
          echo " 預算金額 / 截止投標日期 exist and what they are really called)"
          UNIT=$(jq -r '.records[0].unit_id // empty' search.json)
          JOB=$(jq -r '.records[0].job_number // empty' search.json)
          echo "unit_id=$UNIT job_number=$JOB"
          if [ -n "$UNIT" ] && [ -n "$JOB" ]; then
            curl -sSL -m 30 -o tender.json \
              -w "HTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n" \
              --get --data-urlencode "unit_id=$UNIT" --data-urlencode "job_number=$JOB" \
              "$BASE/tender" || echo "FAILED: $?"
            echo "--- tender top-level keys ---"
            jq -r 'keys[]' tender.json 2>&1 | head -20
            echo "--- ALL detail field names (candidate columns[] values) ---"
            jq -r '[.records[]?.detail // {} | keys[]] | unique[]' tender.json 2>&1 | head -80
            echo "--- any field mentioning 預算 / 投標 / 決標金額 ---"
            jq -r '[.records[]?.detail // {} | keys[]] | unique[] | select(test("預算|投標|金額|截止"))' tender.json 2>&1 | head -40
          else
            echo "SKIPPED: no unit_id/job_number in the search response"
          fi
