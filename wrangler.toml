name = "opendata-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]

# API keys for the upstream open-data platforms. Never put real values here.
# Set them as Workers secrets instead:
#   wrangler secret put CWA_API_KEY        (中央氣象署 opendata.cwa.gov.tw)
#   wrangler secret put MOENV_API_KEY      (環境部 data.moenv.gov.tw)
#   wrangler secret put TDX_CLIENT_ID      (交通部 TDX tdx.transportdata.tw — OAuth2 client id)
#   wrangler secret put TDX_CLIENT_SECRET  (交通部 TDX — OAuth2 client secret, paired with the above)
# For local development, put them in a git-ignored `.dev.vars` file:
#   CWA_API_KEY=your-key-here
#   MOENV_API_KEY=your-key-here
#   TDX_CLIENT_ID=your-tdx-client-id
#   TDX_CLIENT_SECRET=your-tdx-client-secret

# Short-TTL response cache. Create your own namespace and paste its id below:
#   wrangler kv namespace create CACHE
# The binding is optional — if you remove this block, the server still works,
# every tool call just hits the upstream API directly.
[[kv_namespaces]]
binding = "CACHE"
id = "f9ad969ae389420cb6512f8a55e8177f"

[observability]
enabled = true
