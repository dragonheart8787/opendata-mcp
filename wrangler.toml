name = "opendata-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]

# API keys for the upstream open-data platforms. Never put real values here.
# Set them as Workers secrets instead:
#   wrangler secret put CWA_API_KEY        (中央氣象署 opendata.cwa.gov.tw)
#   wrangler secret put MOENV_API_KEY      (環境部 data.moenv.gov.tw)
#   wrangler secret put TDX_CLIENT_ID      (交通部 TDX tdx.transportdata.tw — OAuth2 client id)
#   wrangler secret put TDX_CLIENT_SECRET  (交通部 TDX — OAuth2 client secret, paired with the above)
# For local development, put them in a git-ignored `.dev.vars` file:
#   CWA_API_KEY=your-key-here
#   MOENV_API_KEY=your-key-here
#   TDX_CLIENT_ID=your-tdx-client-id
#   TDX_CLIENT_SECRET=your-tdx-client-secret

# Short-TTL response cache. Create your own namespace and paste its id below:
#   wrangler kv namespace create CACHE
# The binding is optional — if you remove this block, the server still works,
# every tool call just hits the upstream API directly.
[[kv_namespaces]]
binding = "CACHE"
id = "f9ad969ae389420cb6512f8a55e8177f"

# Per-IP rate limit on POST /mcp — protects this deployment's own shared
# upstream API quota (CWA/MOENV/TDX) from abuse/scraping now that the repo
# and its landing page are public. 60 requests per 60 seconds per IP: far
# more than any real conversational use needs (even a busy multi-tool
# conversation is nowhere near 1 request/second sustained), but caps
# runaway automated traffic. Optional — remove this block and the server
# still works, every request just skips the check (see infra/rate-limit.ts).
# `namespace_id` is an arbitrary id you choose yourself, scoped to your own
# Cloudflare account (unlike the KV namespace above, it isn't a resource
# you pre-create with a separate command) — self-hosters can deploy with
# this value unchanged.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
